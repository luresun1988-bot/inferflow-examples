name: Setup help
description: Ask for help with Cursor, Dify, Open WebUI, SDK, or OpenAI-compatible setup.
title: "[Setup]: "
labels: ["setup-help"]
body:
  - type: markdown
    attributes:
      value: |
        Please run the cURL test in the README first. It helps separate Inferflow API issues from tool-specific settings.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Cursor
        - Dify
        - Open WebUI
        - Python OpenAI SDK
        - JavaScript OpenAI SDK
        - LangChain
        - cURL
        - Other
    validations:
      required: true
  - type: input
    id: base-url
    attributes:
      label: Base URL used
      placeholder: https://api.inferflow.dev/v1
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      placeholder: deepseek-v4-flash
    validations:
      required: true
  - type: dropdown
    id: curl-test
    attributes:
      label: Did the README cURL test work?
      options:
        - "Yes"
        - "No"
        - "I have not tried it yet"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error message
      description: Remove API keys, tokens, emails, or other secrets before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Include any relevant provider settings, client version, or steps to reproduce.
